<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Performance Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fb;
            color: #333;
            padding: 20px;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .dashboard-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .date-range {
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: auto;
            gap: 20px;
        }
        
        .dashboard-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            transition: transform 0.3s ease;
        }
        
        .dashboard-card:hover {
            transform: translateY(-5px);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .filter-control {
            display: flex;
            gap: 10px;
        }
        
        select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 12px;
        }
        
        .chart-container {
            height: 250px;
            width: 100%;
        }
        
        .metrics-card {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        
        .metric-block {
            flex: 1;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid #3498db;
        }
        
        .metric-value {
            font-size: 26px;
            font-weight: 700;
            margin: 10px 0;
            color: #2c3e50;
        }
        
        .metric-label {
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .metric-change {
            font-size: 12px;
            font-weight: 600;
        }
        
        .positive {
            color: #2ecc71;
        }
        
        .negative {
            color: #e74c3c;
        }
        
        .Electronics {
            background-color: rgba(52, 152, 219, 0.2);
            border-color: #3498db;
        }
        
        .Clothing {
            background-color: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
        }
        
        .HomeGoods {
            background-color: rgba(155, 89, 182, 0.2);
            border-color: #9b59b6;
        }
        
        .full-width {
            grid-column: span 2;
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .metrics-card {
                grid-column: span 1;
                flex-direction: column;
            }
            
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <div class="dashboard-title">Sales Performance Dashboard</div>
        <div class="date-range">January - June 2023</div>
    </div>
    
    <!-- KPI Metrics Summary -->
    <div class="dashboard-grid">
        <div class="dashboard-card metrics-card">
            <div class="metric-block">
                <div class="metric-label">Total Revenue</div>
                <div class="metric-value" id="total-revenue">$0</div>
            </div>
            <div class="metric-block">
                <div class="metric-label">Total Units Sold</div>
                <div class="metric-value" id="total-units">0</div>
            </div>
            <div class="metric-block">
                <div class="metric-label">Total Profit</div>
                <div class="metric-value" id="total-profit">$0</div>
            </div>
            <div class="metric-block">
                <div class="metric-label">Average Profit Margin</div>
                <div class="metric-value" id="avg-margin">0%</div>
            </div>
        </div>
        
        <!-- Revenue by Region and Product -->
        <div class="dashboard-card">
            <div class="card-header">
                <div class="card-title">Revenue by Region & Product</div>
                <div class="filter-control">
                    <select id="region-product-filter">
                        <option value="all">All Regions</option>
                        <option value="North">North</option>
                        <option value="South">South</option>
                        <option value="East">East</option>
                        <option value="West">West</option>
                    </select>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="region-product-chart"></canvas>
            </div>
        </div>
        
        <!-- Sales Channel Comparison -->
        <div class="dashboard-card">
            <div class="card-header">
                <div class="card-title">Sales Channel Comparison</div>
                <div class="filter-control">
                    <select id="channel-metric-filter">
                        <option value="revenue">Revenue</option>
                        <option value="units">Units Sold</option>
                        <option value="profit">Profit</option>
                    </select>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="channel-comparison-chart"></canvas>
            </div>
        </div>
        
        <!-- Product Profitability Analysis -->
        <div class="dashboard-card">
            <div class="card-header">
                <div class="card-title">Product Profitability Analysis</div>
            </div>
            <div class="chart-container">
                <canvas id="product-profitability-chart"></canvas>
            </div>
        </div>
        
        <!-- Monthly Sales Trend -->
        <div class="dashboard-card">
            <div class="card-header">
                <div class="card-title">Monthly Sales Trend</div>
                <div class="filter-control">
                    <select id="trend-metric-filter">
                        <option value="revenue">Revenue</option>
                        <option value="units">Units Sold</option>
                        <option value="profit">Profit</option>
                    </select>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="monthly-trend-chart"></canvas>
            </div>
        </div>
        
        <!-- Profit Margin by Product -->
        <div class="dashboard-card full-width">
            <div class="card-header">
                <div class="card-title">Profit Margin by Product Category</div>
            </div>
            <div class="chart-container">
                <canvas id="margin-product-chart"></canvas>
            </div>
        </div>
        
        <!-- Regional Performance -->
        <div class="dashboard-card full-width">
            <div class="card-header">
                <div class="card-title">Regional Performance</div>
                <div class="filter-control">
                    <select id="regional-metric-filter">
                        <option value="revenue">Revenue</option>
                        <option value="units">Units Sold</option>
                        <option value="profit">Profit</option>
                    </select>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="regional-performance-chart"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        // CSV Data
        const csvData = `Date,Region,Product,Sales Channel,Units Sold,Unit Price,Total Revenue,Total Cost,Profit
15-01-2023,North,Electronics,Online,120,299.99,35998.8,25199.16,10799.6
22-01-2023,South,Clothing,Offline,85,59.99,5099.15,3059.49,2039.66
05-02-2023,East,Home Goods,Online,95,149.99,14249.05,9974.34,4274.72
18-02-2023,West,Electronics,Offline,110,279.99,30798.9,21559.23,9239.67
03-03-2023,North,Clothing,Online,150,49.99,7498.5,4499.1,2999.4
20-03-2023,South,Home Goods,Offline,70,129.99,9099.3,6369.51,2729.79
02-04-2023,East,Electronics,Online,130,319.99,41598.7,29119.09,12479.6
15-04-2023,West,Clothing,Offline,100,69.99,6999,4199.4,2799.6
01-05-2023,North,Home Goods,Online,80,159.99,12799.2,8959.44,3839.76
18-05-2023,South,Electronics,Offline,90,289.99,26099.1,18269.37,7829.73
04-06-2023,East,Clothing,Online,140,54.99,7698.6,4619.16,3079.44
21-06-2023,West,Home Goods,Offline,75,139.99,10499.25,7349.48,3149.78`;

        // Parse CSV
        const parsedData = Papa.parse(csvData, {
            header: true,
            dynamicTyping: true
        }).data;
        
        // Convert string values to numbers
        parsedData.forEach(row => {
            row['Units Sold'] = parseInt(row['Units Sold']);
            row['Unit Price'] = parseFloat(row['Unit Price']);
            row['Total Revenue'] = parseFloat(row['Total Revenue']);
            row['Total Cost'] = parseFloat(row['Total Cost']);
            row['Profit'] = parseFloat(row['Profit']);
        });
        
        // Calculate KPIs
        const totalRevenue = parsedData.reduce((sum, row) => sum + row['Total Revenue'], 0);
        const totalUnits = parsedData.reduce((sum, row) => sum + row['Units Sold'], 0);
        const totalProfit = parsedData.reduce((sum, row) => sum + row['Profit'], 0);
        const avgMargin = (totalProfit / totalRevenue) * 100;
        
        // Update KPI elements
        document.getElementById('total-revenue').textContent = '$' + totalRevenue.toLocaleString(undefined, {maximumFractionDigits: 2, minimumFractionDigits: 2});
        document.getElementById('total-units').textContent = totalUnits.toLocaleString();
        document.getElementById('total-profit').textContent = '$' + totalProfit.toLocaleString(undefined, {maximumFractionDigits: 2, minimumFractionDigits: 2});
        document.getElementById('avg-margin').textContent = avgMargin.toFixed(2) + '%';
        
        // Chart colors
        const colors = {
            Electronics: 'rgba(52, 152, 219, 0.7)',
            Clothing: 'rgba(46, 204, 113, 0.7)',
            'Home Goods': 'rgba(155, 89, 182, 0.7)',
            Online: 'rgba(52, 152, 219, 0.7)',
            Offline: 'rgba(230, 126, 34, 0.7)',
            North: 'rgba(52, 152, 219, 0.7)',
            South: 'rgba(46, 204, 113, 0.7)',
            East: 'rgba(155, 89, 182, 0.7)',
            West: 'rgba(230, 126, 34, 0.7)'
        };
        
        // Extract unique values
        const regions = [...new Set(parsedData.map(row => row.Region))];
        const products = [...new Set(parsedData.map(row => row.Product))];
        const channels = [...new Set(parsedData.map(row => row['Sales Channel']))];
        
        // Group data by region and product
        function groupByRegionAndProduct() {
            const result = {};
            
            regions.forEach(region => {
                result[region] = {};
                products.forEach(product => {
                    result[region][product] = 0;
                });
            });
            
            parsedData.forEach(row => {
                result[row.Region][row.Product] += row['Total Revenue'];
            });
            
            return result;
        }
        
        // Group data by month
        function groupByMonth(metric) {
            const months = ['January', 'February', 'March', 'April', 'May', 'June'];
            const result = {};
            
            months.forEach(month => {
                result[month] = 0;
            });
            
            parsedData.forEach(row => {
                const date = new Date(row.Date.split('-').reverse().join('-'));
                const month = date.toLocaleString('default', { month: 'long' });
                result[month] += row[metric];
            });
            
            return result;
        }
        
        // Group data by sales channel
        function groupByChannel(metric) {
            const result = {};
            
            channels.forEach(channel => {
                result[channel] = 0;
            });
            
            parsedData.forEach(row => {
                result[row['Sales Channel']] += row[metric];
            });
            
            return result;
        }
        
        // Group data by region
        function groupByRegion(metric) {
            const result = {};
            
            regions.forEach(region => {
                result[region] = 0;
            });
            
            parsedData.forEach(row => {
                result[row.Region] += row[metric];
            });
            
            return result;
        }
        
        // Group data by product
        function groupByProduct(metric) {
            const result = {};
            
            products.forEach(product => {
                result[product] = 0;
            });
            
            parsedData.forEach(row => {
                result[row.Product] += row[metric];
            });
            
            return result;
        }
        
        // Calculate profit margin by product
        function calculateProfitMarginByProduct() {
            const totalRevenueByProduct = groupByProduct('Total Revenue');
            const totalProfitByProduct = groupByProduct('Profit');
            const result = {};
            
            products.forEach(product => {
                result[product] = (totalProfitByProduct[product] / totalRevenueByProduct[product]) * 100;
            });
            
            return result;
        }
        
        // 1. Revenue by Region and Product Chart
        const regionProductData = groupByRegionAndProduct();
        const regionProductCtx = document.getElementById('region-product-chart').getContext('2d');
        
        const regionProductChart = new Chart(regionProductCtx, {
            type: 'bar',
            data: {
                labels: regions,
                datasets: products.map((product, index) => {
                    return {
                        label: product,
                        data: regions.map(region => regionProductData[region][product]),
                        backgroundColor: colors[product],
                        borderColor: colors[product].replace('0.7', '1'),
                        borderWidth: 1
                    };
                })
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        stacked: true
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Revenue ($)'
                        }
                    }
                }
            }
        });
        
        // 2. Sales Channel Comparison Chart
        function updateChannelChart(metric) {
            const channelData = groupByChannel(metric);
            const channelLabels = {
                'Total Revenue': 'Revenue ($)',
                'Units Sold': 'Units',
                'Profit': 'Profit ($)'
            };
            
            const channelCtx = document.getElementById('channel-comparison-chart').getContext('2d');
            
            if (window.channelChart) {
                window.channelChart.destroy();
            }
            
            window.channelChart = new Chart(channelCtx, {
                type: 'pie',
                data: {
                    labels: channels,
                    datasets: [{
                        label: metric,
                        data: channels.map(channel => channelData[channel]),
                        backgroundColor: channels.map(channel => colors[channel]),
                        borderColor: channels.map(channel => colors[channel].replace('0.7', '1')),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.raw.toLocaleString(undefined, {maximumFractionDigits: 2, minimumFractionDigits: 2});
                                    return `${label}: ${value}`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        updateChannelChart('Total Revenue');
        
        // 3. Product Profitability Chart
        const profitabilityCtx = document.getElementById('product-profitability-chart').getContext('2d');
        
        const totalUnitsByProduct = groupByProduct('Units Sold');
        const marginByProduct = calculateProfitMarginByProduct();
        const revenueByProduct = groupByProduct('Total Revenue');
        
        const profitabilityChart = new Chart(profitabilityCtx, {
            type: 'bubble',
            data: {
                datasets: products.map(product => {
                    return {
                        label: product,
                        data: [{
                            x: totalUnitsByProduct[product],
                            y: marginByProduct[product],
                            r: Math.sqrt(revenueByProduct[product]) / 50
                        }],
                        backgroundColor: colors[product].replace('0.7', '0.5'),
                        borderColor: colors[product].replace('0.7', '1'),
                        borderWidth: 1
                    };
                })
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Units Sold'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Profit Margin (%)'
                        }
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.dataset.label || '';
                                const x = context.parsed.x.toLocaleString();
                                const y = context.parsed.y.toFixed(2) + '%';
                                const product = label;
                                const revenue = revenueByProduct[product].toLocaleString(undefined, {maximumFractionDigits: 2, minimumFractionDigits: 2});
                                return [`${label}`, `Units: ${x}`, `Margin: ${y}`, `Revenue: $${revenue}`];
                            }
                        }
                    }
                }
            }
        });
        
        // 4. Monthly Trend Chart
        function updateTrendChart(metric) {
            const monthlyData = groupByMonth(metric);
            const months = Object.keys(monthlyData);
            const metricLabels = {
                'Total Revenue': 'Revenue ($)',
                'Units Sold': 'Units',
                'Profit': 'Profit ($)'
            };
            
            const trendCtx = document.getElementById('monthly-trend-chart').getContext('2d');
            
            if (window.trendChart) {
                window.trendChart.destroy();
            }
            
            window.trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: metricLabels[metric],
                        data: months.map(month => monthlyData[month]),
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 2,
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        updateTrendChart('Total Revenue');
        
        // 5. Profit Margin by Product Chart
        const marginProductCtx = document.getElementById('margin-product-chart').getContext('2d');
        const marginData = calculateProfitMarginByProduct();
        
        const marginProductChart = new Chart(marginProductCtx, {
            type: 'bar',
            data: {
                labels: products,
                datasets: [{
                    label: 'Profit Margin (%)',
                    data: products.map(product => marginData[product]),
                    backgroundColor: products.map(product => colors[product]),
                    borderColor: products.map(product => colors[product].replace('0.7', '1')),
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Profit Margin (%)'
                        }
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.dataset.label || '';
                                const value = context.raw.toFixed(2) + '%';
                                return `${label}: ${value}`;
                            }
                        }
                    }
                }
            }
        });
        
        // 6. Regional Performance Chart
        function updateRegionalChart(metric) {
            const regionalData = groupByRegion(metric);
            const metricLabels = {
                'Total Revenue': 'Revenue ($)',
                'Units Sold': 'Units',
                'Profit': 'Profit ($)'
            };
            
            const regionalCtx = document.getElementById('regional-performance-chart').getContext('2d');
            
            if (window.regionalChart) {
                window.regionalChart.destroy();
            }
            
            window.regionalChart = new Chart(regionalCtx, {
                type: 'bar',
                data: {
                    labels: regions,
                    datasets: [{
                        label: metricLabels[metric],
                        data: regions.map(region => regionalData[region]),
                        backgroundColor: regions.map(region => colors[region]),
                        borderColor: regions.map(region => colors[region].replace('0.7', '1')),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = metric !== 'Units Sold' 
                                        ? '$' + context.raw.toLocaleString(undefined, {maximumFractionDigits: 2, minimumFractionDigits: 2})
                                        : context.raw.toLocaleString();
                                    return `${label}: ${value}`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        updateRegionalChart('Total Revenue');
        
        // Event listeners for filters
        document.getElementById('channel-metric-filter').addEventListener('change', function() {
            const metric = this.value === 'revenue' ? 'Total Revenue' : this.value === 'units' ? 'Units Sold' : 'Profit';
            updateChannelChart(metric);
        });
        
        document.getElementById('trend-metric-filter').addEventListener('change', function() {
            const metric = this.value === 'revenue' ? 'Total Revenue' : this.value === 'units' ? 'Units Sold' : 'Profit';
            updateTrendChart(metric);
        });
        
        document.getElementById('regional-metric-filter').addEventListener('change', function() {
            const metric = this.value === 'revenue' ? 'Total Revenue' : this.value === 'units' ? 'Units Sold' : 'Profit';
            updateRegionalChart(metric);
        });
        
        document.getElementById('region-product-filter').addEventListener('change', function() {
            const selectedRegion = this.value;
            
            if (selectedRegion === 'all') {
                // Show all regions
                regionProductChart.data.labels = regions;
                regionProductChart.data.datasets = products.map((product, index) => {
                    return {
                        label: product,
                        data: regions.map(region => regionProductData[region][product]),
                        backgroundColor: colors[product],
                        borderColor: colors[product].replace('0.7', '1'),
                        borderWidth: 1
                    };
                });
            } else {
                // Show only selected region
                regionProductChart.data.labels = [selectedRegion];
                regionProductChart.data.datasets = products.map((product, index) => {
                    return {
                        label: product,
                        data: [regionProductData[selectedRegion][product]],
                        backgroundColor: colors[product],
                        borderColor: colors[product].replace('0.7', '1'),
                        borderWidth: 1
                    };
                });
            }
            
            regionProductChart.update();
        });
    </script>
</body>
</html>
